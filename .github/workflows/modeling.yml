name: Modeling checks
on:
  push:
    branches: [main]
    paths: ['modeling/**', '.github/workflows/modeling.yml']
  pull_request:
    paths: ['modeling/**', '.github/workflows/modeling.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: modeling/requirements-lock.txt
      - run: python -m pip install -r modeling/requirements-lock.txt
      - run: python -m unittest discover -s modeling/tests -v
      - run: python -m modeling.demo --items 60 --trees 60 --walk-forward --output modeling/output/ci-multiplier
      - run: python -m modeling.demo --mode blend --items 60 --trees 60 --output modeling/output/ci-blend
